name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy

      - name: Rust format
        working-directory: server
        run: cargo fmt --manifest-path rust/fidelity-csv/Cargo.toml --check

      - name: Rust CSV processor tests
        working-directory: server
        run: npm run test:rust

      - name: Rust lint
        working-directory: server
        run: cargo clippy --locked --manifest-path rust/fidelity-csv/Cargo.toml --all-targets -- -D warnings

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server syntax check
        working-directory: server
        run: node --check server.js

      - name: Server regression tests
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_PATH: ':memory:'
          DOTENV_CONFIG_PATH: /dev/null
          ENCRYPTION_KEY: '1212121212121212121212121212121212121212121212121212121212121212'
          SESSION_SECRET: synthetic-ci-session-secret
        run: npm test
