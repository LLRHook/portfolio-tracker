services:
  server:
    build:
      context: ./server
    ports:
      - "${SERVER_PORT:-34892}:${SERVER_PORT:-34892}"
    environment:
      - PORT=${SERVER_PORT:-34892}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - CLIENT_ORIGIN=http://localhost:${CLIENT_PORT:-34891}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - server_data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      - "${CLIENT_PORT:-34891}:${CLIENT_PORT:-34891}"
    environment:
      - VITE_API_URL=http://localhost:${SERVER_PORT:-34892}
      - CLIENT_PORT=${CLIENT_PORT:-34891}
      - SERVER_PORT=${SERVER_PORT:-34892}
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  server_node_modules:
  client_node_modules:
  server_data:
